# Paired Tektronix-current-probe versus PicoScope/INA225 validation.
# Every tek_hsi_<run>.parquet / usb_osc_data_<run>.parquet pair is one
# simultaneously triggered repetition. The tool never concatenates pairs.

dataset_root: external-measurements/tek_scope_comparison/gemmfp32
output_root: external-analysis/tek_scope_comparison_gemmfp32_v1
dataset:
  id: gemmfp32
  workload_label: GEMM-FP32
  analysis_role: paired_scope_validation
  signal_label: estimated power derived from calibrated current

# Optional independently recorded idle tree. Same-run pre-benchmark idle is
# always preferred. A rate-matched external idle reference is used only when a
# workload record has no statistically usable idle window, and is also reported
# separately as a DC-baseline diagnostic. The raw absolute current/energy values
# are never silently corrected.
external_idle:
  enabled: false
  dataset_root: external-measurements/tek_scope_comparison/idle
  matching_policy: exact_directory_rate
  minimum_pairs: 5
  use_for_psd_when_same_run_unavailable: true
  use_for_baseline_diagnostics: true
  use_for_incremental_energy: true
  maximum_idle_current_difference_ma: 50.0

zero_offset_correction:
  enabled: false
  target_source: tek
  detection_source: external_idle_rate_medians
  application_scope: all_workload_rates
  apply_when_detected: true
  minimum_reference_rates: 2
  minimum_reference_pairs_total: 10
  minimum_abs_offset_ma: 50.0
  maximum_abs_correction_ma: 500.0
  maximum_rate_median_deviation_ma: 10.0
  maximum_rate_q95_span_ma: 15.0
  minimum_sign_consistency_fraction: 1.0
  preserve_raw_metrics: true
source_rates:
  directory_rate_source: tek
  tek_policy: directory_rate
  pico_policy: capped_directory_rate
  pico_max_rate_sps: 5000000
  duration_tolerance_s: 0.000002
  duration_tolerance_relative: 0.00001

# The measurement tree is populated by another account/process and is read-only
# for the analysis user. Empty directories and incomplete file pairs are therefore
# ignored and documented instead of aborting the complete multi-rate run.
input_policy:
  ignore_empty_rate_directories: true
  ignore_unpaired_runs: true
  ignore_invalid_pairs: true
  fail_if_no_valid_rates: true
  minimum_rows_per_file: 2
  require_equal_sample_counts: false
  # Low-rate records cover 10 s, while later high-rate records are shorter
  # because of oscilloscope memory limits. In auto mode a SectionLength marker
  # is honoured when present; otherwise the modal physical record duration is
  # inferred from the Tek and Pico row counts using their separate rates.
  expected_duration_s: auto
  duration_tolerance_samples: 2

sources:
  tek:
    file_pattern: "tek_hsi_{run}.parquet"
    column: current
    display_name: "Tektronix current probe"
    raw_unit: A
    calibration:
      # The HSI export is already in amperes.
      offset_raw: 0.0
      gain_a_per_raw: 1.0

  pico:
    file_pattern: "usb_osc_data_{run}.parquet"
    column: current
    display_name: "PicoScope + INA225"
    raw_unit: V_at_INA225_output
    calibration:
      # Existing two-point PicoScope current calibration:
      # I[A] = (raw[V] + offset_raw) * gain_a_per_raw
      offset_raw: 0.0004272598504
      gain_a_per_raw: 1.99000512058047

# Both currents are converted to power with exactly the same validated
# current-dependent voltage estimate. This isolates the current-path comparison.
voltage_model:
  type: linear_current
  calibration_id: "jetson_module_voltage_fit_thesis_2026"
  # U[V] = intercept_v + slope_v_per_a * I[A]
  intercept_v: 19.062607082705
  slope_v_per_a: -0.07444582
  valid_current_range_a: [0.0, 3.5]

alignment:
  enabled: true
  # The GPIO trigger already provides hardware alignment. Cross-correlation only
  # measures and, for waveform/coherence metrics, removes a small residual offset.
  max_lag_ms: 10.0
  analysis_rate_sps: 20000
  lowpass_hz: 500.0
  drift_window_s: 2.0
  apply_to_waveform_metrics: true

analysis_windows:
  # The current-only Parquet exports do not contain the GPIO channel.  Use
  # fixed_time, fixed_fraction, or per_rate_time once the oscilloscope
  # pre-trigger position is known.  first_valid_detection preserves the
  # legacy behaviour and records detector residuals as diagnostics only.
  shared_anchor_mode: first_valid_detection
  trigger_fraction: auto
  trigger_time_by_rate_s: {}
  # The trigger channel is not contained in the current-only Parquet exports.
  # Therefore the main load transition is detected from the two calibrated traces.
  # Set mode=fixed_trigger and trigger_time_s once the trigger index is exported.
  mode: after_main_rise
  trigger_time_s: auto
  detection_smoothing_ms: 20.0
  threshold_fraction: 0.30
  guard_after_trigger_s: 0.50
  idle_gap_s: 0.10
  idle_duration_s: 0.80
  stop_margin_s: 0.20
  minimum_active_duration_s: 2.0
  # Workloads such as YOLO do not necessarily contain a unique current step.
  # The first valid record still anchors the common hardware-trigger position;
  # this flag controls only whether noisy step-detector residuals are warned.
  step_detector_diagnostics: true

averaging_windows_ms: [10.0, 50.0, 100.0]

spectral:
  enabled: true
  # Higher-rate directories are analysed automatically up to this ceiling.
  max_analysis_rate_sps: 250000000
  segment_duration_s: 0.50
  max_nperseg: 1048576
  overlap_fraction: 0.50
  cumulative_percentiles: [0.95, 0.99]
  variance_capture_rates_sps: [2000, 100000, 125000, 160000, 1000000, 5000000, 25000000, 125000000, 250000000]
  coherence_threshold: 0.80
  psd_ratio_tolerance_db: 3.0
  minimum_frequency_hz: 1.0
  plot_max_points: 60000

  # v0.5.6: Tektronix-native PSD is the primary spectral reference.
  primary_reference_source: tek
  minimum_welch_segments: 8
  minimum_idle_welch_segments: 2
  primary_reference_min_pairs: 5
  primary_reference_min_active_duration_s: 2.0
  primary_reference_min_idle_duration_s: 0.5

  # The paired PicoScope usability figure prefers the direct 5-MS/s vs.
  # 5-MS/s comparison. The Tek-only high-frequency extension is separate.
  paired_validation_preferred_rate_sps: 5000000

validation:
  minimum_pairs: 5
  q95_abs_charge_error_pct: 1.0
  q95_abs_energy_error_pct: 1.0
  q95_abs_alignment_ms: 1.0
  median_correlation_100ms: 0.99
  # Correlations are reported only when at least this many averaged windows
  # exist. Short records automatically fall back from 100 ms to 50 or 10 ms.
  minimum_correlation_windows: 8
  # Low-current segments are retained and reported as a separate operating
  # region because a small absolute offset produces a large relative error.
  low_current_threshold_a: 0.75
