# One-command discovery, incremental per-workload analysis, multi-workload
# comparison, and paper-artifact generation.
dataset_root: external-measurements/tek_scope_comparison
analysis_root: external-analysis
state_root: external-analysis/edge_ai_auto_pipeline_v1
idle_directory_name: idle

base_multi_workload_config: config_multi_workload.yaml
generic_scope_template: config_scope_resnet50.yaml

# Existing campaigns keep their established scientific configuration. New and
# unknown directories use the generic record-start/external-idle template.
known_scope_configs:
  gemmfp32: config_scope_comparison.yaml
  yolofp32: config_scope_yolofp32.yaml
  gemma3-4b: config_scope_gemma3_4b.yaml
  resnet50: config_scope_resnet50.yaml

# Optional metadata overrides. Unknown directories are still analysed using a
# deterministic human-readable label inferred from their directory name.
workload_metadata:
  gemmfp32:
    label: GEMM-FP32
    family: GEMM
    precision: FP32
    sort_order: 10
  gemmint8:
    label: GEMM-INT8
    family: GEMM
    precision: INT8
    sort_order: 11
  yolofp32:
    label: YOLO-FP32
    family: YOLO
    precision: FP32
    sort_order: 20
  yoloint8:
    label: YOLO-INT8
    family: YOLO
    precision: INT8
    sort_order: 21
  gemma3-4b:
    label: Gemma3-4B
    family: Gemma3-4B
    precision: unspecified
    sort_order: 30
  resnet50:
    label: ResNet-50 FP32
    family: ResNet-50
    precision: FP32
    sort_order: 40

discovery:
  exclude_directories: [idle]
  common_rate_sps: 5000000
  minimum_paired_runs_any_rate: 1
  minimum_paired_runs_common_rate: 5

execution:
  # A failed or incomplete new campaign is documented, while completed
  # campaigns continue into the cross-workload analysis.
  continue_on_error: true
  # Workload-level stat/config fingerprints avoid even invoking an unchanged
  # scope analysis. If a source changed, the existing per-pair fingerprints
  # still ensure selective recomputation.
  skip_fresh_scope: true
  skip_fresh_multi: true
  generate_artifacts: true

# Separate TIM/journal outputs after the ordinary scope/multi-workload stages.
# Not included in the legacy numerical fingerprint.
journal_enabled: true
journal_config: config_journal.yaml
